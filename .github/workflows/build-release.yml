name: Build and Release CV PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tectonic
        run: |
          curl -sSL -o tectonic.tar.gz https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf tectonic.tar.gz tectonic
          sudo install -m 755 tectonic /usr/local/bin/tectonic

      - name: Build PDF
        run: |
          mkdir -p build
          tectonic -X compile main.tex --outdir build

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/main.pdf Vivek-Vijayan-CV.pdf
          gh release create latest Vivek-Vijayan-CV.pdf \
            --title "Latest CV" \
            --notes "Auto-built from commit ${{ github.sha }}"
